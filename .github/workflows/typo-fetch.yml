name: 오타 체크 원문 수집
run-name: 오타 체크 원문 ${{ inputs.id || '예약 실행' }}

on:
  schedule:
    # 한국시간 평일 10:07~19:37, 30분마다 (UTC로 적는다). GitHub 예약 실행은 늦거나 빠질 수 있어 자주 돌리고,
    # 스크립트가 끝난 지 가장 최근 회차(10·12·14·16·18시 마감)를 이미 받았으면 바로 끝낸다
    - cron: "7,37 1-10 * * 1-5"
  workflow_dispatch:
    inputs:
      id:
        description: 요청 id (예 r_20261127_1)
        required: true
      start:
        description: 범위 시작 ISO (+09:00)
        required: true
      end:
        description: 범위 끝 ISO (+09:00, 미포함)
        required: true
      extra:
        description: 다시 받을 기사 번호(쉼표 구분, 선택)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: typo-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 원문 수집 (2초 간격) · 다른 매체 검색
        env:
          TYPO_ID: ${{ inputs.id }}
          TYPO_START: ${{ inputs.start }}
          TYPO_END: ${{ inputs.end }}
          TYPO_EXTRA: ${{ inputs.extra }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python3 typo/fetch.py
      - name: 결과 저장
        if: always()
        env:
          RUN_LABEL: ${{ inputs.id || '예약 실행' }}
        run: |
          if [ ! -d data/typo ]; then echo "결과 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/typo
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "오타 체크 원문 $RUN_LABEL"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          exit 1
