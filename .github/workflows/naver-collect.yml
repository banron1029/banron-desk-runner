name: 네이버 뉴스·트렌드 수집

on:
  schedule:
    # 한국시간 평일 07:30, 15:30 (UTC 기준으로 적는다)
    - cron: "30 22 * * 0-4"
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naver-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python3 naver/collect.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d data/naver ]; then echo "수집 결과 없음"; exit 0; fi
          git add data/naver
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "네이버 수집 결과 갱신"
            git push
          fi
